      try {
        const raw = window.localStorage.getItem(key);
        if (!raw) return fallback;
        const parsed = JSON.parse(raw);

      } catch (err) {
        return fallback;
      }
    }

    function saveToStorage(key, value) {

    function getTodayISO() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function addDaysISO(baseISO, deltaDays) {
      const [y, m, d] = baseISO.split('-').map(Number);
      const dt = new Date(y, m - 1, d + deltaDays);
      return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
    }

    function formatCurrency(value) {
      return Number(value || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function formatDateBR(isoDate) {
      if (!isoDate) return '';
      const parts = isoDate.split('-');
      return parts.length === 3 ? `${parts[2]}/${parts[1]}/${parts[0]}` : isoDate;
    }

    function formatMonthDayBR(isoDate) {
      if (!isoDate) return '';
      const parts = isoDate.split('-');
      return parts.length === 3 ? `${parts[2]}/${parts[1]}` : isoDate;
    }

    function getWeekdayLabel(isoDate) {
      const [y, m, d] = isoDate.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      return ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'][dt.getDay()];
    }

    function getNextDays(count = 14) {
      const days = [];
      const today = getTodayISO();
      for (let i = 0; i < count; i++) {
        const iso = addDaysISO(today, i);
        const [y, m, d] = iso.split('-').map(Number);
        const dt = new Date(y, m - 1, d);
        days.push({
          iso,
          dayNumber: String(d).padStart(2, '0'),
          weekday: getWeekdayLabel(iso),
          monthShort: dt.toLocaleDateString('pt-BR', { month: 'short' }).replace('.', '')
        });
      }
      return days;
    }

    function daysBetweenISO(fromISO, toISO) {
      if (!fromISO || !toISO) return 0;
      const [y1, m1, d1] = fromISO.split('-').map(Number);
      const [y2, m2, d2] = toISO.split('-').map(Number);
      return Math.round((Date.UTC(y2, m2 - 1, d2) - Date.UTC(y1, m1 - 1, d1)) / 86400000);
    }

    function timeToMinutes(hhmm) {
      const [h, m] = (hhmm || '09:00').split(':').map(Number);
      return h * 60 + m;
    }

    function minutesToTime(mins) {
      return `${String(Math.floor(mins / 60)).padStart(2, '0')}:${String(mins % 60).padStart(2, '0')}`;
    }

    function generateTimeSlots(barber, dateISO, appointments, durationMinutes) {
      if (!barber || !barber.active || !dateISO) return [];
      const [y, m, d] = dateISO.split('-').map(Number);
      const weekday = new Date(y, m - 1, d).getDay();
      if (!Array.isArray(barber.workingDays) || !barber.workingDays.includes(weekday)) return [];

      const startMin = timeToMinutes(barber.workStart || '09:00');
      const endMin = timeToMinutes(barber.workEnd || '20:00');
      const step = Number(barber.slotIntervalMinutes || 30);
      const needed = Math.max(15, Number(durationMinutes || 30));

      const dayBusy = appointments.filter(
        (a) => a.barberId === barber.id && a.date === dateISO && a.status !== 'cancelled'
      );

      const now = new Date();
      const todayISO = getTodayISO();
      const nowMinutes = now.getHours() * 60 + now.getMinutes();

      const slots = [];
      for (let cur = startMin; cur + needed <= endMin; cur += step) {
        if (dateISO === todayISO && cur <= nowMinutes + 15) continue;
        const candidateStart = cur;
        const candidateEnd = cur + needed;
        const overlaps = dayBusy.some((apt) => {
          const aptStart = timeToMinutes(apt.time);
          const aptEnd = aptStart + Number(apt.totalDurationMinutes || 30);
          return candidateStart < aptEnd && candidateEnd > aptStart;
        });
        if (!overlaps) slots.push(minutesToTime(cur));
      }
      return slots;
    }

    function findNextSuitableDate(barber, startISO, appointments, durationMinutes) {
      for (let i = 0; i < 21; i++) {
        const candidateDate = addDaysISO(startISO, i);
        const freeSlots = generateTimeSlots(barber, candidateDate, appointments, durationMinutes);
        if (freeSlots.length > 0) {
          return { date: candidateDate, firstSlot: freeSlots[0] };
        }
      }
      return { date: addDaysISO(startISO, 1), firstSlot: '10:00' };
    }

    function formatPhoneMask(raw) {
      const digits = String(raw || '').replace(/\D/g, '').slice(0, 11);
      if (digits.length <= 2) return digits ? `(${digits}` : '';
      if (digits.length <= 7) return `(${digits.slice(0, 2)}) ${digits.slice(2)}`;
      return `(${digits.slice(0, 2)}) ${digits.slice(2, 7)}-${digits.slice(7)}`;
    }

    function buildWhatsAppUrl(phoneDigits, message) {
      const digits = String(phoneDigits || '').replace(/\D/g, '');
      const clean = digits ? (digits.startsWith('55') ? digits : `55${digits}`) : '';
      const encoded = encodeURIComponent(message);
      return clean ? `https://wa.me/${clean}?text=${encoded}` : `https://wa.me/?text=${encoded}`;
    }

    function generateCheckinCode() {
      return `MRB-${Math.floor(1000 + Math.random() * 9000)}`;
    }

            revenue,
            revenueSharePct,
            avgTicket,
            workedHours: (workedMinutes / 60).toFixed(1),
            occupancyPct,
            comboRatePct,
            improvements,
            strengths

        const ranked = [...perBarber].sort((a, b) => b.revenue - a.revenue);

          const targetDate = addDaysISO(apt.date, 30);
          const brb = barbers.find((b) => b.id === apt.barberId) || activeBarbers[0];
          const suitable = brb ? findNextSuitableDate(brb, targetDate, appointments, 40) : { date: targetDate, firstSlot: '10:00' };
          out.push({
            appointmentId: apt.id,
            clientName: apt.clientName,
            clientPhone: apt.clientPhone,
            elapsedDays,
            suggestedDate: suitable.date,
            suggestedTime: suitable.firstSlot,
            barberName: brb?.name || 'Barbeiro',
            reminderSent: Boolean(apt.returnReminderSent)
          });
        }
        return out.sort((a, b) => b.elapsedDays - a.elapsedDays);
      }, [appointments, barbers, activeBarbers]);

        const [, curMonth, curDay] = getTodayISO().split('-');

          if (parts.length !== 3) continue;
          const digits = String(apt.clientPhone || '').replace(/\D/g, '');
          const key = digits.length >= 8 ? digits : apt.id;
          if (seen.has(key)) continue;
          seen.add(key);
          out.push({
            appointmentId: apt.id,
            clientName: apt.clientName,
            clientPhone: apt.clientPhone,
            birthDate: apt.birthDate,
            birthMonthDay: `${parts[2]}/${parts[1]}`,
            isTodayBirthday: parts[1] === curMonth && parts[2] === curDay,
            birthdayWishSent: Boolean(apt.birthdayWishSent)
          });
        }
        return out.sort((a, b) => (a.isTodayBirthday === b.isTodayBirthday ? 0 : a.isTodayBirthday ? -1 : 1));

                                  value={brb.workEnd}
                                  onChange={(e) => setBarbers((prev) => prev.map((b) => b.id === brb.id ? { ...b, workEnd: e.target.value } : b))}
                                  className="bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 text-white"
                                />
                              </div>
                              <button
                                type="button"
                                onClick={() => setBarbers((prev) => prev.map((b) => b.id === brb.id ? { ...b, active: !b.active } : b))}
                                className={`w-full py-1.5 rounded-lg text-xs font-extrabold ${brb.active ? 'bg-emerald-500/20 text-emerald-300' : 'bg-slate-800 text-slate-400'}`}
                              >
                                {brb.active ? 'Ativo na Agenda' : 'Inativo'}
                              </button>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}

                    {adminTab === 'services' && (
                      <div className="rounded-2xl bg-slate-900 border border-slate-800 p-5 space-y-3">
                        <h2 className="text-lg font-black text-white">Catálogo de Serviços & Preços ({services.length})</h2>
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                          {services.map((srv) => (
                            <div key={srv.id} className="rounded-xl bg-slate-950 border border-slate-800 p-3 flex items-center justify-between gap-2">
                              <div>
                                <p className="text-xs font-extrabold text-white">{srv.name}</p>
                                <span className="text-[11px] text-slate-400">{srv.category} • {srv.durationMinutes} min</span>
                              </div>
                              <input
                                type="number"
                                value={srv.price}
                                onChange={(e) => setServices((prev) => prev.map((s) => s.id === srv.id ? { ...s, price: Number(e.target.value) } : s))}
                                className="w-20 bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 text-xs font-bold text-emerald-400 text-right"
                              />
                            </div>
                          ))}
                        </div>
                      </div>
                    )}

                    {adminTab === 'shop' && (
                      <div className="rounded-2xl bg-slate-900 border border-slate-800 p-5 space-y-3">
                        <h2 className="text-lg font-black text-white">Cidade, Endereço & Galeria da Barbearia</h2>
                        <input type="text" value={shopInfo.name} onChange={(e) => setShopInfo({ ...shopInfo, name: e.target.value })} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white" />
                        <input type="text" value={shopInfo.slogan} onChange={(e) => setShopInfo({ ...shopInfo, slogan: e.target.value })} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white" />
                        <input type="text" value={shopInfo.address} onChange={(e) => setShopInfo({ ...shopInfo, address: e.target.value })} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white" />
                        <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 pt-2">
                          {(shopInfo.gallery || []).map((g) => (
                            <div key={g.id} className="rounded-xl overflow-hidden border border-slate-800 bg-slate-950">
                              <img src={g.url} alt={g.caption} className="w-full h-24 object-cover" />
                              <p className="p-2 text-[10px] text-slate-300 line-clamp-1">{g.caption}</p>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}
                  </>
                )}
              </div>
            )}
          </main>

          {/* Footer */}
          <footer className="border-t border-slate-800 bg-slate-950 py-6 px-4 sm:px-6 mt-8">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
              <div>
                <p className="text-xs font-extrabold text-white">{shopInfo.name} • {shopInfo.city}/{shopInfo.state}</p>
                <p className="text-[11px] text-amber-300">{shopInfo.slogan}</p>
              </div>
              <button
                type="button"
                onClick={handleInstallAppClick}
                className="px-4 py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-amber-300 border border-amber-500/30 text-xs font-extrabold"
              >
                Instalar App no Celular (Tela Inicial)
              </button>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
